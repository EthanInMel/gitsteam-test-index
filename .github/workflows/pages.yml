name: pages
on:
  push: {branches: [main]}
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: index-pages-main
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Sign current main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml --ref main --repo "${{ github.repository }}"
  build:
    if: ${{ inputs.sha != '' }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.revision.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || 'main' }}
          fetch-depth: 0
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            # A late stale caller can replace a newer pending concurrency run.
            # Queue a fresh signing/deployment pass rather than losing that revision.
            gh workflow run snapshot.yml --ref main --repo "${{ github.repository }}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.revision.outputs.current == 'true'
        run: node scripts/build-api.mjs --index . --out dist
      - if: steps.revision.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
