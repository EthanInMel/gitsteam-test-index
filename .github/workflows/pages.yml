name: pages
on:
  push: {branches: [main]}
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: index-pages-main
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Sign current main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run snapshot.yml --ref main --repo "$REPO"
  build:
    if: ${{ inputs.sha != '' }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.revision.outputs.current }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            # A late stale caller can replace a newer pending concurrency run.
            # Queue a fresh signing/deployment pass rather than losing that revision.
            gh workflow run snapshot.yml --ref main --repo "$REPO"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: steps.revision.outputs.current == 'true'
        run: node scripts/build-api.mjs --index . --out dist
      - if: steps.revision.outputs.current == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
