name: verify-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
env:
  VESPER_VERSION: '0.4.0'
  VESPER_SHA256: '8401d69fe9f9e3f87886f8a332fdae2ff4d61dbd7dfead2602561775d70d4bb0'
  VESPER_RELEASES_REPO: EthanInMel/gsp-releases
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Checkout base index for rollback comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-index
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-verify-paths.mjs
      - name: Validate metadata
        run: node scripts/validate-store.mjs .
      - name: Install verified vesper binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vesper"
          curl -fsSL --retry 3 "https://github.com/$VESPER_RELEASES_REPO/releases/download/vesper-v$VESPER_VERSION/vesper-linux-x64" -o "$RUNNER_TEMP/vesper/vesper"
          echo "$VESPER_SHA256  $RUNNER_TEMP/vesper/vesper" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/vesper/vesper"
          echo "$RUNNER_TEMP/vesper" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vesper/vesper" --version
      - name: Verify signed index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          apps=$(git diff --name-only "$BASE_SHA" HEAD | awk -F/ '$1 == "apps" {print $2}' | sort -u)
          if [ -z "$apps" ]; then vesper index verify --targets-only --index . --previous .base-index; else for app in $apps; do vesper index verify --targets-only --index . --app "$app" --previous .base-index; done; fi
