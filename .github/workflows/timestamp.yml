name: timestamp
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
permissions: {actions: write, contents: write, pages: write, id-token: write}
env:
  GSP_VERSION: '0.2.0'
  GSP_SHA256: '4795b5875e6601e3fc3091fc44f149f4c8cc1112ac5ecdc3718a9b65e5e15582'
  GSP_RELEASES_REPO: EthanInMel/gsp-releases
jobs:
  timestamp:
    concurrency:
      group: index-signing-main
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.sign.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: main}
      - name: Install verified gsp binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gsp"
          curl -fsSL --retry 3 "https://github.com/$GSP_RELEASES_REPO/releases/download/gsp-v$GSP_VERSION/gsp-linux-x64" -o "$RUNNER_TEMP/gsp/gsp"
          echo "$GSP_SHA256  $RUNNER_TEMP/gsp/gsp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gsp/gsp"
          echo "$RUNNER_TEMP/gsp" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gsp/gsp" --version
      - name: Sign and push current main
        id: sign
        env:
          GSP_ONLINE_KEY: ${{ secrets.GSP_ONLINE_KEY }}
        shell: bash
        run: bash scripts/sign-index.sh timestamp
  pages:
    needs: timestamp
    uses: ./.github/workflows/pages.yml
    with:
      sha: ${{ needs.timestamp.outputs.sha }}
