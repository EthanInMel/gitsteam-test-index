name: timestamp
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
permissions: {actions: write, contents: write, pages: write, id-token: write}
env:
  VESPER_VERSION: '0.4.0'
  VESPER_SHA256: '82f6812b76b0d708504354b469f17e0ffe47b8fd65db8e9e31b136136ec9de94'
  VESPER_RELEASES_REPO: EthanInMel/gsp-releases
jobs:
  timestamp:
    concurrency:
      group: index-signing-main
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.sign.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, ref: main}
      - name: Install verified vesper binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vesper"
          curl -fsSL --retry 3 "https://github.com/$VESPER_RELEASES_REPO/releases/download/vesper-v$VESPER_VERSION/vesper-linux-x64" -o "$RUNNER_TEMP/vesper/vesper"
          echo "$VESPER_SHA256  $RUNNER_TEMP/vesper/vesper" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/vesper/vesper"
          echo "$RUNNER_TEMP/vesper" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vesper/vesper" --version
      - name: Sign and push current main
        id: sign
        env:
          VESPER_ONLINE_KEY: ${{ secrets.VESPER_ONLINE_KEY }}
        shell: bash
        run: bash scripts/sign-index.sh timestamp
  pages:
    needs: timestamp
    uses: ./.github/workflows/pages.yml
    with:
      sha: ${{ needs.timestamp.outputs.sha }}
