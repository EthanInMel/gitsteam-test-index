name: snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  GSP_VERSION: '0.1.0'
  GSP_SHA256: '7e6f1c0b7a4d6176a0e137f55a31e0f88f62872ebd06333ea3516738362de24b'
  GSP_RELEASES_REPO: EthanInMel/gsp-releases
jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verified gsp binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gsp"
          curl -fsSL --retry 3 "https://github.com/$GSP_RELEASES_REPO/releases/download/gsp-v$GSP_VERSION/gsp-linux-x64" -o "$RUNNER_TEMP/gsp/gsp"
          echo "$GSP_SHA256  $RUNNER_TEMP/gsp/gsp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gsp/gsp"
          echo "$RUNNER_TEMP/gsp" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gsp/gsp" --version
      - name: Snapshot changed apps
        env:
          GSP_ONLINE_KEY: ${{ secrets.GSP_ONLINE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for app in $(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do gsp index snapshot --index . --app "$app"; done
      - name: Commit snapshots
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          set -euo pipefail
          git add apps
          if ! git diff --cached --quiet; then git commit -m 'chore: refresh snapshots'; fi
          git push || { git pull --rebase && git push; }
